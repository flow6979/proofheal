<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tiny Shop</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; background: #f4f6fb; color: #1b1f2a; }
    aside { background: #1b1f2a; color: #e8ecf5; padding: 24px 16px; }
    aside a { color: #9ec1ff; display: block; margin-top: 12px; }
    .bag-pill { display: inline-block; background: #ff7a59; color: #fff; border-radius: 999px; padding: 2px 10px; font-weight: 700; }
    .content { padding: 32px 40px; }
    .grid { display: grid; grid-template-columns: repeat(3, 200px); gap: 16px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .cta { background: #ff7a59; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; font-weight: 600; }
    .summary { background: #fff; border-radius: 12px; padding: 20px; width: 360px; }
    .row { display: flex; justify-content: space-between; padding: 6px 0; }
  </style>
</head>
<body>
  <aside>
    <div>🛍️ Tiny Shop</div>
    <p>Bag <span class="bag-pill" id="bag-count" data-testid="bag-count">{{ cart_count }}</span></p>
    <a class="nav-bag" id="to-bag" href="/checkout">View bag &amp; pay</a>
  </aside>
  <section class="content">{% block content %}{% endblock %}</section>
</body>
</html>
